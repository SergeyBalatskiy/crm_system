<div id="financial-results-container">
    
       <!-- Блок фильтров -->
    <div id="filters">
        <label>С даты: <input type="date" id="start_day"></label>
        <label>По дату: <input type="date" id="finish_day"></label>

        <label>Тип операции:
            <select name="type_of_operation" id="type_of_operation" style="padding: 5px 8px; border: 1px solid #ebedf2; border-radius: 6px; font-size: 0.75rem;">
                <option value="">Все операции</option>
                <option value="Поступление">Поступление</option>
                <option value="Исход">Исход</option>
            </select>
        </label>

        <label>Категория:
            <select name="category_of_operation" id="category_of_operation" style="padding: 5px 8px; border: 1px solid #ebedf2; border-radius: 6px; font-size: 0.75rem;">
                <option value="">Все категории</option>
                <option value="Продажа">Продажа</option>
                <option value="Покупка">Покупка</option>
                <option value="Гарантийный возврат">Возврат</option>
                <option value="Оказание ремонтных услуг">Ремонт</option>
                <option value="Прочее">Прочее</option>
            </select>
        </label>

        <button onclick="updateChart()">Применить</button>
    </div>

    <!-- Контейнер для графика -->
    <div style="width: 80%; max-width: 800px; margin-top: 20px;">
        <canvas id="financeChart"></canvas>
    </div>
</div>
<script>
    // Уничтожаем старый график, если он есть
    if (window.financeChart instanceof Chart) {
        window.financeChart.destroy();
    }

    function initChart() {
        const ctx = document.getElementById('financeChart').getContext('2d');
        
        // Градиент для столбцов (делает график современнее)
        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(137, 80, 252, 0.8)'); // Фиолетовый (как кнопка)
        gradient.addColorStop(1, 'rgba(137, 80, 252, 0.2)');

        window.financeChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [],
                datasets: [{
                    label: 'Сумма (₽)',
                    data: [],
                    backgroundColor: gradient,
                    borderColor: '#8950fc',
                    borderWidth: 1,
                    borderRadius: 4, // Скругление верхних углов столбцов
                    barPercentage: 0.6, // Ширина столбика
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false, // Позволяет графику тянуться
                plugins: {
                    legend: { display: false }, // Скрываем лишнюю легенду сверху
                    tooltip: {
                        backgroundColor: 'rgba(63, 66, 84, 0.9)',
                        titleFont: { size: 13 },
                        bodyFont: { size: 14, weight: 'bold' },
                        padding: 10,
                        cornerRadius: 6,
                        callbacks: {
                            // Форматируем подпись при наведении
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                if (context.parsed.y !== null) {
                                    // Добавляем пробелы для тысяч (10 000) и значок рубля
                                    label += new Intl.NumberFormat('ru-RU').format(context.parsed.y) + ' ₽';
                                }
                                return label;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: { display: false }, // Убираем вертикальные линии сетки
                        ticks: {
                            maxRotation: 45, // Наклоняем подписи, если их много
                            minRotation: 45,
                            color: '#7e8299',
                            font: { size: 11 }
                        }
                    },
                    y: {
                        beginAtZero: true,
                        border: { display: false }, // Убираем линию оси Y
                        grid: {
                            color: '#ebedf2', // Светло-серые линии
                            drawBorder: false,
                            borderDash: [5, 5], // Делаем линии пунктирными
                        },
                        ticks: {
                            color: '#7e8299',
                            font: { size: 11 },
                            callback: function(value) {
                                // Форматируем ось Y (добавляем пробелы для тысяч)
                                return new Intl.NumberFormat('ru-RU').format(value);
                            }
                        }
                    }
                },
                animation: {
                    duration: 800, // Плавная анимация при обновлении
                    easing: 'easeOutQuart'
                }
            }
        });
    }

    // Функция загрузки данных (осталась без изменений)
    async function updateChart() {
        const params = new URLSearchParams({
            start_day: document.getElementById('start_day').value,
            finish_day: document.getElementById('finish_day').value,
            category_of_operation: document.getElementById('category_of_operation').value,
            type_of_operation: document.getElementById('type_of_operation').value,
        });

        const response = await fetch(`/profile/api/chart-histories/?${params.toString()}`);
        const result = await response.json();

        // Обновляем данные графика
        window.financeChart.data.labels = result.date_time;
        window.financeChart.data.datasets[0].data = result.everyb_object;
        
        // Перерисовываем
        window.financeChart.update();
    }

    // Инициализация при загрузке
    initChart();
    updateChart();
</script>
