{% extends "profile_user/base.html" %}
{% load static %}

{% block content %}

<div class="document-show-place">
    <div class="document-show-box">
        <div id="toast-container"></div>

        <!-- Шапка: Заголовок, Выбор, Сохранить, По умолчанию -->
        <div class="header-row">
            <h1>Печатные формы</h1>

            <form method="get" class="navigation-select">
                <div class="selected-document">
                    <select class="custom-select" name="documents" id="page-select" autocomplete="off"
                        hx-trigger="change" hx-target="#hidden-data-container" hx-get="{% url 'tiny_mce' %}"
                        hx-swap="innerHTML">
                        <option value="" disabled selected hidden>Выберите документ...</option>
                        <option value="garanty_doc">Акт о гарантии</option>
                        <option value="adoption_doc">Акт о принятии</option>
                        <option value="cancell_doc">Акт о отказе</option>
                        <option value="complete_doc">Акт о выполненных работах</option>
                    </select>
                </div>
            </form>

            <button type="button" id='save-doc-btn' style="display: none;" class="btn-action btn-save"
                onclick="tinymce.triggerSave(); htmx.trigger('#editor-form', 'submit');">
                Сохранить документ
            </button>

            <div id="reset-btn-container"></div>
        </div>

        <div class="custom-divider"></div>

        <div id="hidden-data-container" style="display: none;"></div>

        <!-- Только редактор скрывается до выбора документа -->
        <div id="editor-container" style="display: none;">
            <form id="editor-form" hx-post="{% url 'tiny_mce' %}" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
                {% csrf_token %}
                <input type="hidden" name="document" id="current-document-input" value="">
                {{ tiny_mce.media }}
                {{ tiny_mce.as_p }}
            </form>
        </div>

        <!-- Линия и кнопки вынесены наружу — они всегда видимы -->
        <div class="bottom-section">
            <div class="custom-divider"></div>

            <div class="bottom-actions">
                <a href="{% url 'categories' %}" class="btn btn-primary btn-next">
                    <svg class="arrow-left-4" style="height: 25px; fill: white; transform: rotate(180deg);"
                        viewBox="0 0 100 85">
                        <polygon
                            points="58.263,0.056 100,41.85 58.263,83.641 30.662,83.641 62.438,51.866 0,51.866 0,31.611 62.213,31.611 30.605,0 58.263,0.056" />
                    </svg>
                </a>
                <a href="{% url 'form-editor' %}" class="btn btn-primary btn-next">
                    <svg class="arrow-right-4" viewBox="0 0 100 85" style="height: 25px; fill: white;">
                        <polygon
                            points="58.263,0.056 100,41.85 58.263,83.641 30.662,83.641 62.438,51.866 0,51.866 0,31.611 62.213,31.611 30.605,0 58.263,0.056" />
                    </svg>
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const selectElement = document.getElementById('page-select');
        const saveBtn = document.getElementById('save-doc-btn');
        const editorContainer = document.getElementById('editor-container');

        if (selectElement) selectElement.selectedIndex = 0;
        if (editorContainer) editorContainer.style.display = 'none';
        if (saveBtn) saveBtn.style.display = 'none';

        if (selectElement) {
            selectElement.addEventListener('change', function () {
                if (!this.value) {
                    saveBtn.style.display = 'none';
                    editorContainer.style.display = 'none';
                }
            });
        }
    });

    document.body.addEventListener('htmx:afterSwap', function (event) {
        if (event.detail.target.id === 'hidden-data-container') {
            const fetchedContent = document.getElementById('fetched-content');
            const fetchedDocType = document.getElementById('fetched-doc-type');

            if (fetchedContent && tinymce.activeEditor) {
                tinymce.activeEditor.setContent(fetchedContent.innerHTML);

                const inputDoc = document.getElementById('current-document-input');
                if (inputDoc && fetchedDocType) {
                    inputDoc.value = fetchedDocType.value;
                }

                document.getElementById('editor-container').style.display = 'block';
                document.getElementById('save-doc-btn').style.display = 'block';
            }
        }
    });

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type} fade-in`;

        const icon = type === 'success'
            ? `<svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l4.992-5.99a.75.75 0 0 0-.018-1.042z"/>
           </svg>`
            : `<svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>
           </svg>`;

        alertDiv.innerHTML = `${icon}<span>${message}</span>`;
        container.appendChild(alertDiv);

        setTimeout(() => {
            alertDiv.style.opacity = '0';
            alertDiv.style.transition = 'opacity 0.4s ease';
            setTimeout(() => alertDiv.remove(), 400);
        }, 3500);
    }

    document.body.addEventListener('success_save_doc', function () {
        showToast('Изменения успешно сохранены!', 'success');
    });

    document.body.addEventListener('no_changes_doc', function () {
        showToast('Изменения не обнаружены.', 'danger');
    });

    document.body.addEventListener('backup_success', function () {
        showToast('Документ восстановлен!', 'success');
    });

    document.body.addEventListener('htmx:configRequest', function (event) {
        event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
    });
</script>

{% endblock %}
