{% extends "profile_user/base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'profile_user/css/tinymce.css' %}">

<div class="document-show-place">
    <div class="document-show-box">
        <h1>Печатные формы</h1>

        <hr class="custom-divider">

        <form method="get" class="navigation-select">
            <div class="selected-document">
                <label for="page-select">Выберите документ</label>
                <select class="custom-select mb-4" name="documents" id="page-select" hx-trigger="change"
                    hx-target="#hidden-data-container" hx-get="{% url 'tiny_mce' %}" hx-swap="innerHTML">
                    <option value="" disabled selected hidden>Выберите документ...</option>
                    <option value="garanty_doc">Акт о гарантии</option>
                    <option value="adoption_doc">Акт о принятии</option>
                    <option value="cancell_doc">Акт о отказе</option>
                    <option value="complete_doc">Акт о выполненных работах</option>
                </select>
            </div>
        </form>

        <div id="hidden-data-container" style="display: none;"></div>

        <div id="editor-container" style="display: none;">
            <form method="post" action="">
                {% csrf_token %}
                <input type="hidden" name="document" id="current-document-input" value="">

                {{ tiny_mce.media }}
                {{ tiny_mce.as_p }}

                <!-- Добавить выход из создания категории через esc! (.js) -->

                <!-- Необходимо изменить и подкорректировать визуал чтобы он был ровным, чтобы сначала появлялись 2 кнопки вперед и назад, а потом, после выбора
                появлялась посередине кнопка. Также нужно сделать ограничитель с серой "полосой" снизу + добавить кнопку которая "восстанавливает" документ до дефолтного
                состояния ("По умолчанию") <- Скорее всего, сделать эту кнопку нужно сверху правее от самого выбора формы -->

                <!-- В БУДУЩЕМ ДОБАВИТЬ СПРАВА ОКНО КОТОРОЕ БУДЕТ ОТВЕЧАТЬ ЗА ВСТАВКУ ЭЛЕМЕНТОВ
                 КАК ЭТО СДЕЛАТЬ - ПОКА ЧТО Я НЕ ЗНАЮ, НО УВЕРЕН ЧТО ЭТО ЭТО НЕНАДОЛГО... -->

                <a href="{% url 'categories' %}" class="btn btn-primary btn-next">Назад</a>
                <button type="submit">Сохранить документ</button>
                <a href="{% url 'form-editor' %}" class="btn btn-primary btn-next">Далее</a>
            </form>
        </div>
    </div>
</div>

<script>
    document.body.addEventListener('htmx:afterSwap', function (event) {
        if (event.detail.target.id === 'hidden-data-container') {
            const fetchedContent = document.getElementById('fetched-content');
            const fetchedDocType = document.getElementById('fetched-doc-type');

            if (fetchedContent && tinymce.activeEditor) {
                tinymce.activeEditor.setContent(fetchedContent.innerHTML);

                const inputDoc = document.getElementById('current-document-input');
                if (inputDoc && fetchedDocType) {
                    inputDoc.value = fetchedDocType.value;
                }

                // 3. Ставим 'flex' вместо 'block', чтобы не ломать Flexbox-сетку
                document.getElementById('editor-container').style.display = 'flex';
            }
        }
    });
</script>
{% endblock %}
