{% if irrelevant_forms %}
<form hx-post="{% url 'form-editor' %}" hx-target="#show-data-forms" hx-swap="innerHTML">
    {% csrf_token %}

    <!-- Передаем id секции и тип заказа дальше в POST -->
    <input type="hidden" name="objects_show" value="{{ objects_show }}">
    <input type="hidden" name="type_of_order_selected" value="{{ type_of_order_selected }}">

    <div class="fields-selection-grid">
        {% for form in irrelevant_forms %}
        <label class="field-checkbox-card">
            <input type="checkbox" name="selected_forms" value="{{ form.field_key }}">
            <span class="field-label">{{ form.label }}</span>
        </label>
        {% endfor %}
    </div>

    <div class="sidebar-footer">
        <button type="submit" class="btn btn-primary btn-full-width">+ Добавить выбранные</button>
    </div>
</form>
{% else %}
<p class="placeholder-text">Все доступные поля уже добавлены в эту секцию.</p>
{% endif %}
