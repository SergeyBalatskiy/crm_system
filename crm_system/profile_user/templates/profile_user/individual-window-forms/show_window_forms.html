{% if irrelevant_forms %}
<div class="fields-selection-grid">
    {% for form in irrelevant_forms %}
    <!-- Вызываем JS функцию при клике по карточке -->
    <div class="field-checkbox-card"
        style="cursor: pointer; padding: 10px; border: 1px solid #ccc; margin-bottom: 8px; border-radius: 6px;"
        onclick="insertFieldIntoSlot('{{ objects_show }}', '{{ form.field_key }}', '{{ form.label }}')">
        <span class="field-label">{{ form.label }}</span>
    </div>
    {% endfor %}
</div>
{% else %}
<p class="placeholder-text">Все доступные поля уже добавлены в эту секцию.</p>
{% endif %}

<form hx-get="{% url 'create-new-form' %}" class="new_individual_form" hx-target="#show_new_form_create">

    {% csrf_token %}

    <!-- Передаем скрытые параметры прямо в форме -->
    <!-- Тип заказа -->
    <input type="hidden" name="type_of_order_selected" value="{{ type_of_order_selected }}">
    <!-- Категория -->
    <input type="hidden" name="category" value="{{ objects_show }}">
    <!-- Название только самого поля (phone, master etc) -->

    <!-- Кнопка для запроса -->
    <button type="submit">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-square"
            viewBox="0 0 16 16">
            <path
                d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h12zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H2z" />
            <path
                d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z" />
        </svg>
        <span>Создать новую форму</span>
    </button>

</form>
