{% extends "finance/base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'finance/css/main-balance.css' %}">
<script src="{% static 'finance/js/main-balance.js' %}" defer></script>

<div class="div-place-form-balance">
    <div class="div-box-form-balance">

        <!-- Верхняя шапка с кассой и кнопкой перенаправления -->
        <div class="finance-header">
            <div class="header-title-box">
                <h2>История финансовых операций</h2>
                <div class="cash-card-badge">
                    <i class="fa-solid fa-wallet"></i>
                    <span>В кассе: <strong>{{ cash.money_balance }} ₽</strong></span>
                </div>
            </div>

            <!-- Кнопка перехода к внесению/списанию кассы -->
            <div class="header-actions">
                <a href="{% url 'insert_cash' %}" class="btn-action-insert">
                    <i class="fa-solid fa-circle-plus"></i> Продажа товара
                </a>
                <a href="{% url 'other_transaction' %}" class="btn-action-insert">
                    <i class="fa-solid fa-circle-plus"></i> Прочие транзакции
                </a>
            </div>
        </div>

        <div id="messages-container">
            {% include 'finance/messages.html' %}
        </div>

        <!-- Панель фильтров -->
        <form id="filter-form" method="GET" action="{% url 'main_cash' %}" class="filter-toolbar">
            
            <!-- Быстрый поиск -->
            <div class="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" name="fast_search_all" id="search-input" placeholder="Поиск по названию, коду, сумме, комментарию..." autocomplete="off">
            </div>

            <!-- Тип операции -->
            <select class="custom-select" id="history_operation_select" name="selected_finance_operation" autocomplete="off">
                <option value="">Все типы</option>
                <option value="income">Поступление</option>
                <option value="outcome">Исход / Списание</option>
            </select>

            <!-- Категория -->
            <select class="custom-select" id="history_category_select" name="selected_finance_category" autocomplete="off">
                <option value="">Все категории</option>
                <option value="Продажа">Продажа</option>
                <option value="Покупка">Покупка</option>
                <option value="Гарантийный возврат">Гарантийный возврат</option>
                <option value="Прочее">Прочее</option>
            </select>

            <!-- Селект даты / Диапазон -->
            <div class="date-filter-container">
                <select class="custom-select" id="history_date_select" name="search_date_operation" autocomplete="off">
                    <option value="">За всё время</option>
                    <option value="date_today">Сегодня</option>
                    <option value="date_yesterday">Вчера</option>
                    <option value="date_this_week">За эту неделю</option>
                    <option value="date_this_month">За месяц</option>
                    <option value="custom">📅 Указать период...</option>
                </select>

                <div class="date-range-wrapper hidden" id="custom-date-range">
                    <div class="date-field">
                        <label for="date_start_input">От:</label>
                        <input type="date" name="date_start_input" id="date_start_input" class="date-input" autocomplete="off">
                    </div>
                    <div class="date-field">
                        <label for="date_end_input">До:</label>
                        <input type="date" name="date_end_input" id="date_end_input" class="date-input" autocomplete="off">
                    </div>
                    <button type="button" class="btn-reset-date" id="btn-reset-date" title="Сбросить даты">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

        </form>

        <!-- Контейнер карточек -->
        <div class="history-list-scrollable" id="history-list-container">
            {% include 'finance/partials/history-list.html' %}
        </div>

    </div>
</div>
{% endblock %}
