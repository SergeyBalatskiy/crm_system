{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <link rel="shortcut icon" href="#">
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.js"
        integrity="sha384-Q+Dky3iHVJOr6wUjQ4ulh6uQ76an/t+ak1+PjMVaxRjbZamFLAG+u9InkfjbsEQf"
        crossorigin="anonymous"></script>

    <!-- Select2 / для DAL -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script type="text/javascript" src="{% static 'autocomplete_light/autocomplete_light.js' %}"></script>
    <script type="text/javascript" src="{% static 'autocomplete_light/select2.js' %}"></script>

    <!-- Статика JS для гарантийной формы и основного шаблона сайта form-removal -->
    <script src="{% static 'storage/js/form-removal.js' %}" defer></script>
    <script src="{% static 'storage/js/garanty-storage.js' %}" defer></script>

    <!-- Статика CSS для гарантийной формы -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'profile_user/css/stylesheet.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'storage/css/garanty-storage.css' %}" type="text/css">
</head>

<body>

    <header class="site-header">
        <div class="logo">
            <a href="#">MY.SKLAD</a>
        </div>
        <nav class="site-nav">
            <ul>
                <li><a href="#"><i class="fa-solid fa-house"></i>Главная</a></li>
                <li><a href="#"><i class="fa-regular fa-address-card"></i>Заказы</a></li>
                <li><a href="#"><i class="fa-solid fa-hand-holding-dollar"></i>Услуги</a></li>
                <li><a href="#"><i class="fa-solid fa-store"></i>Склад</a></li>
                <li><a href="#"><i class="fa-solid fa-money-bill"></i>Финансы</a></li>
            </ul>

            <ul class="bottom-nav">
                <li><a href="#"><i class="fa-solid fa-list"></i>Настройки</a></li>
                <li><a href="#"><i class="fa-solid fa-user"></i>{{ user.first_name }} {{ user.last_name.0 }}.</a></li>
            </ul>
        </nav>
    </header>

    {% block content %}
    {% endblock %}

</body>

</html>
