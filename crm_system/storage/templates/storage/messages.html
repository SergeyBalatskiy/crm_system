{% load static %}
<link rel="stylesheet" href="{% static 'storage/css/messages.css' %}">

{% if messages %}
<div class="messages-wrapper">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">
        {% if message.tags == 'success' %}
        <svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
            viewBox="0 0 16 16">
            <path
                d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l4.992-5.99a.75.75 0 0 0-.018-1.042z" />
        </svg>
        {% elif message.tags == 'error' or message.tags == 'danger' %}
        <svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
            viewBox="0 0 16 16">
            <path
                d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293 5.354 4.646z" />
        </svg>
        {% endif %}

        <span class="alert-text">{{ message }}</span>
        <button type="button" class="alert-close" onclick="dismissAlert(this.closest('.alert'))"
            title="Закрыть">&times;</button>
    </div>
    {% endfor %}
</div>

<script>
    function dismissAlert(alertEl) {
        if (!alertEl || alertEl.classList.contains('fade-out')) return;
        alertEl.classList.add('fade-out');
        setTimeout(() => alertEl.remove(), 300);
    }

    document.querySelectorAll('.messages-wrapper .alert').forEach(alertEl => {
        setTimeout(() => dismissAlert(alertEl), 4000);
    });
</script>
{% endif %}
