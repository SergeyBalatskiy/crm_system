{% extends "storage/base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'storage/css/history-storage.css' %}">
<script src="{% static 'storage/js/history-storage.js' %}" defer></script>

<div id="messages-container">
    {% include 'storage/messages.html' %}
</div>

<div class="div-place-storage-history">
    <div class="div-box-storage-history">

        <!-- Шапка истории -->
        <div class="history-header">
            <h2>История операций склада</h2>
            <span class="history-count">Записей всего: {{ storage_history_items|length }}</span>
        </div>

        <!-- Панель фильтров -->
        <form id="filter-form" method="GET" action="{% url 'filter_and_history_storage' %}" class="filter-toolbar">
            
            <!-- Поле быстрый поиск -->
            <div class="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" name="fast_search_all" id="search-input" placeholder="Поиск по названию, коду, поставщику..." autocomplete="off">
            </div>

            <!-- Селект типа операции -->
            <select class="custom-select" id="history_operation_select" name="search_history_operation" autocomplete="off">
                <option value="">Все типы операций</option>
                <option value="acceptable_data">Поступление товара</option>
                <option value="removal_data">Списание</option>
                <option value="garanty_removal_data">Гарантийное списание</option>
            </select>

            <!-- ГИБРИДНЫЙ БЛОК ДАТЫ -->
            <div class="date-filter-container">
                
                <!-- 1. Селект быстрых пресетов -->
                <select class="custom-select" id="history_date_select" name="search_date_operation" autocomplete="off">
                    <option value="">За всё время</option>
                    <option value="date_today">Сегодня</option>
                    <option value="date_yesterday">Вчера</option>
                    <option value="date_this_week">За эту неделю</option>
                    <option value="date_this_month">За месяц</option>
                    <option value="custom">📅 Указать период...</option>
                </select>

                <!-- 2. Календарь (От... До...) - по умолчанию скрыт -->
                <div class="date-range-wrapper hidden" id="custom-date-range">
                    <div class="date-field">
                        <label for="date_start_input">От:</label>
                        <input type="date" name="date_start_input" id="date_start_input" class="date-input">
                    </div>
                    <div class="date-field">
                        <label for="date_end_input">До:</label>
                        <input type="date" name="date_end_input" id="date_end_input" class="date-input">
                    </div>
                    <!-- Кнопка сброса обратно на селект -->
                    <button type="button" class="btn-reset-date" id="btn-reset-date" title="Вернуться к быстрым фильтрам">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

            </div>

        </form>

        <!-- Контейнер со списком карточек -->
        <div class="history-list" id="history-list-container">
            {% include 'storage/partials/history-list.html' %}
        </div>

    </div>
</div>
{% endblock %}
