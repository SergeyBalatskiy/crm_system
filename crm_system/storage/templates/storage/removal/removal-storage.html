{% load static %}
<script src="{% static 'storage/js/removal-storage.js' %}" defer></script>
<link rel="stylesheet" href="{% static 'storage/css/removal-storage.css' %}">

<form hx-post="{% url 'removal-storage' %}" class="removal-form-storage">
    {% csrf_token %}
    {{ form_removal.management_form }}

    <div id="removal-div-form">
        {% for form in form_removal %}
        <div class="django-form">
            {{ form.as_p }}
        </div>
        {% endfor %}
    </div>

    <button type="submit" class="btn btn-primary btn-submit">Создать</button>
    <button type="button" id="add-new-form-removal">Новое гарантийное списание</button>
</form>

<div id="empty-form-removal" style="display: none;">
    <div class="django-form">
        {{ form_removal.empty_form.as_p }}
    </div>
</div>
</form>
