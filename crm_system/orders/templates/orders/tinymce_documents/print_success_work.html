<!-- Затемнение фона на весь экран -->
<div style="position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999; display: flex; justify-content: center; align-items: center;">
    
    <!-- Само модальное окно -->
    <div style="background: #fff; width: 850px; height: 90vh; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 15px 35px rgba(0,0,0,0.3); overflow: hidden;">
        
        <!-- Шапка окна -->
        <div style="padding: 15px 20px; background: #f8f9fa; border-bottom: 1px solid #dee2e6; display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; font-size: 1.1rem; color: #333; font-weight: 700;">Предпросмотр акта (Заказ №{{ order.id }})</h3>
            <button type="button" onclick="closePrintModal()" style="background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #6c757d;">&times;</button>
        </div>

        <!-- Область документа с прокруткой -->
        <div id="printable-area" style="flex: 1; overflow-y: auto; padding: 40px; background: #fff; box-sizing: border-box;">
            {{ rendered_document|safe }}
        </div>

        <!-- Подвал с кнопками (Клик по кнопке «Печать» гарантированно открывает системное окно браузера) -->
        <div style="padding: 15px 20px; background: #f8f9fa; border-top: 1px solid #dee2e6; display: flex; justify-content: flex-end; gap: 10px;">
            <button type="button" onclick="closePrintModal()" style="padding: 10px 20px; background: #e9ecef; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; color: #495057;">Закрыть</button>
            <button type="button" onclick="window.print()" style="padding: 10px 25px; background: #8950fc; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;"><i class="fa-solid fa-print"></i> Печать</button>
        </div>
    </div>
</div>

<script>
    // Автоматически закрываем фоновую шторку заказа
    if (typeof closeOrderDrawer === 'function') {
        closeOrderDrawer();
    }

    // Функция закрытия окна и обновления списка заказов сзади
    function closePrintModal() {
        document.getElementById('payment-drawer-container').innerHTML = '';
        location.reload(); // Перезагружаем страницу, чтобы обновить статусы и список заказов
    }
</script>

<!-- Магия CSS для печати: при нажатии на «Печать» на принтер уйдет только документ -->
<style>
    @media print {
        body * {
            visibility: hidden;
        }
        #printable-area, #printable-area * {
            visibility: visible;
        }
        #printable-area {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: auto;
            padding: 0 !important;
            margin: 0 !important;
            background: #fff !important;
        }
    }
</style>
