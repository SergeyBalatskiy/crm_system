{% extends "orders/base.html" %}
{% load static %}

{% block content %}

<!-- Оверлей (затемнение фона) -->
<div id="drawer-overlay" class="drawer-overlay" onclick="closeOrderDrawer()"></div>

<!-- Выезжающая шторка -->
<div id="order-drawer" class="order-drawer">
    <div id="drawer-content-loader"></div>
</div>

<div class="crm-orders-wrapper">
    <div class="crm-orders-container">

        <!-- Верхняя панель управления -->
        <div class="crm-top-panel">
            <div class="crm-title-block">
                <h2>Управление заказами</h2>
                <span class="crm-counter">Активных: {{ orders|length }}</span>
            </div>

            <button type="button" 
                    class="crm-btn-create"
                    hx-get="{% url 'show_form' %}" 
                    hx-target="#drawer-content-loader" 
                    hx-swap="innerHTML"
                    onclick="openOrderDrawer()">
                <i class="fa-solid fa-plus-circle"></i> Новая заявка
            </button>
        </div>

        <!-- Панель фильтров (интерактивная) -->
        <form id="filter-form" method="GET" action="{% url 'orders' %}" class="crm-filter-bar"
              hx-get="{% url 'orders' %}"
              hx-trigger="input changed delay:300ms, change"
              hx-target="#orders-container"
              hx-push-url="false"
              hx-swap="innerHTML">
            
            <!-- Поиск -->
            <div class="crm-search-box">
                <i class="fa-solid search-icon fa-magnifying-glass"></i>
                <input type="text" name="fast_search_all" value="{{ request.GET.fast_search_all }}" placeholder="Поиск по клиенту, телефону, модели или ID..." autocomplete="new-password">
            </div>

            <!-- Тип заказа -->
            <select class="crm-select" name="type_of_order_selected" autocomplete="new-password">
                <option value="">Все типы</option>
                <option value="paid" {% if request.GET.type_of_order_selected == 'paid' %}selected{% endif %}>Платный</option>
                <option value="warranty" {% if request.GET.type_of_order_selected == 'warranty' %}selected{% endif %}>Гарантийный</option>
            </select>

            <!-- Статус -->
            <select class="crm-select" name="search_status_order" autocomplete="new-password">
                <option value="">Все статусы</option>
                <option value="in_process" {% if request.GET.search_status_order == 'in_process' %}selected{% endif %}>На ремонте</option>
                <option value="deferred" {% if request.GET.search_status_order == 'deferred' %}selected{% endif %}>На согласовании</option>
                <option value="success" {% if request.GET.search_status_order == 'success' %}selected{% endif %}>Готов</option>
                <option value="finished" {% if request.GET.search_status_order == 'finished' %}selected{% endif %}>Завершен</option>
                <option value="new" {% if request.GET.search_status_order == 'new' %}selected{% endif %}>Новый</option>
            </select>

            <!-- Даты -->
            <div class="crm-date-wrapper">
                <select class="crm-select" id="history_date_select" name="search_date_operation" autocomplete="new-password" onchange="toggleDateRange(this)">
                    <option value="">За всё время</option>
                    <option value="date_today" {% if request.GET.search_date_operation == 'date_today' %}selected{% endif %}>Сегодня</option>
                    <option value="date_yesterday" {% if request.GET.search_date_operation == 'date_yesterday' %}selected{% endif %}>Вчера</option>
                    <option value="date_this_week" {% if request.GET.search_date_operation == 'date_this_week' %}selected{% endif %}>За неделю</option>
                    <option value="date_this_week" {% if request.GET.search_date_operation == 'date_this_month' %}selected{% endif %}>За месяц</option>
                    <option value="custom" {% if request.GET.search_date_operation == 'custom' %}selected{% endif %}>📅 Период...</option>
                </select>

                <div class="crm-custom-dates {% if not request.GET.date_start_input and request.GET.search_date_operation != 'custom' %}hidden{% endif %}" id="custom-date-range">
                    <input type="date" name="date_start_input" value="{{ request.GET.date_start_input }}" class="crm-date-input" autocomplete="new-password">
                    <input type="date" name="date_end_input" value="{{ request.GET.date_end_input }}" class="crm-date-input" autocomplete="new-password">
                    <button type="button" class="crm-date-reset" onclick="resetDateRange()"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
        </form>

        <!-- Сетка карточек заказов (сюда HTMX подгружает только список) -->
        <div id="orders-container" class="crm-cards-scroll">
            {% include "orders/partials/orders_list.html" %}
        </div>

    </div>
</div>

{% endblock %}
