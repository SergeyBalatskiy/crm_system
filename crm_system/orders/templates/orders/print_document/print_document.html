<!-- Компактная шапка с крестиком (без кнопки "Закрыть") -->
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #ebedf2;">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: 600; color: #3f4254; font-size: 0.95rem;">
        <i class="fa-solid fa-print" style="color: #8950fc;"></i> Печать документов
    </div>
    <button type="button" onclick="document.getElementById('print-popover-drawer-{{ connected_id }}').style.display='none'" style="background: none; border: none; cursor: pointer; color: #7e8299; font-size: 1rem; padding: 0;">
        <i class="fa-solid fa-xmark"></i>
    </button>
</div>

<!-- Форма выбора документа -->
<form hx-post="{% url 'print_document' %}" 
      hx-target="#document-modal-container" 
      hx-swap="innerHTML"
      class="form-section" 
      style="display: flex; flex-direction: column; gap: 10px; margin: 0;"
      onsubmit="document.getElementById('print-popover-drawer-{{ connected_id }}').style.display='none';">
    {% csrf_token %}
    
    <!-- Передаем ID заказа -->
    <input type="hidden" name="get_id_order" value="{{ connected_id }}">

    <div style="display: flex; flex-direction: column; gap: 4px;">
        <label style="font-size: 0.85rem; font-weight: 600; color: #5e6278;">Тип документа:</label>
        <select name="name_document" id="document-select" class="custom-select" style="padding: 6px 10px; font-size: 0.9rem; border-radius: 6px; border: 1px solid #e4e6ef;" onchange="handleDocumentChange(this)">
            <option value="" style="colo #e4e6ef;" disabled selected>Выберите документ</option>
            <option value="Акт о принятии">Акт о принятии</option>
            <option value="Акт о отказе">Акт об отказе</option>
            <option value="Акт о выполненных работах">Акт о выполненных работах</option>
            <option value="Акт о гарантии">Акт о гарантии</option>
        </select>
    </div>

    <!-- Поле для причины отказа (скрыто по умолчанию) -->
    <div id="reason-container" style="display: none; flex-direction: column; gap: 4px;">
        <label style="font-size: 0.85rem; font-weight: 600; color: #f64e60;">Причина отказа <span style="color: #f64e60;">*</span></label>
        <textarea name="reason_for_refusal" 
                  id="reason-input" 
                  class="custom-textarea" 
                  rows="2" 
                  style="padding: 6px 10px; font-size: 0.9rem; border-radius: 6px; border: 1px solid #e4e6ef;"
                  placeholder="Введите причину..."></textarea>
    </div>

    <!-- Кнопка отправки (без громоздкой кнопки закрытия рядом) -->
    <div style="margin-top: 4px;">
        <button type="submit" class="btn-submit-order" style="width: 100%; padding: 8px 12px; font-size: 0.9rem; border-radius: 6px; background: #8950fc; color: #fff; border: none; font-weight: 600; cursor: pointer;">
            Сформировать
        </button>
    </div>
</form>

<script>
    function handleDocumentChange(selectElement) {
        const reasonContainer = document.getElementById('reason-container');
        const reasonInput = document.getElementById('reason-input');

        if (selectElement.value === 'Акт о отказе') {
            reasonContainer.style.display = 'flex';
            reasonInput.setAttribute('required', 'true');
        } else {
            reasonContainer.style.display = 'none';
            reasonInput.removeAttribute('required');
            reasonInput.value = '';
        }
    }
</script>
