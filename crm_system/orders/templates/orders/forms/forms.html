<div class="drawer-header">
    <h3><i class="fa-solid fa-file-circle-plus"></i> Новая заявка на ремонт</h3>
    <button type="button" class="btn-close-drawer" onclick="closeOrderDrawer()">
        <i class="fa-solid fa-xmark"></i>
    </button>
</div>

<!-- Выпадающий селект выбора типа заказа -->
<div class="type_of_order_select" style="padding: 15px 24px 16px 24px;">
    <label class="form-label" style="margin-bottom: 6px; display: block;">Тип заказа</label>
    <select class="custom-select" id="form-select" name="type_of_order_selected" autocomplete="off"
        hx-get="{% url 'show_form' %}"
        hx-trigger="change" 
        hx-target="#form-change"
        hx-swap="innerHTML">
        <option value="paid" {% if current_type == 'paid' %}selected{% endif %}>Платный</option>
        <option value="warranty" {% if current_type == 'warranty' %}selected{% endif %}>Гарантийный</option>
    </select>
</div>

<!-- Контейнер, в который подгружается форма из form_inner.html -->
<div id="form-change">
    {% include 'orders/form_inner/form_inner.html' %}
</div>
